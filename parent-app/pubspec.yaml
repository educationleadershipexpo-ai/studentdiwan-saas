name: student_diwan_parent
description: Student Diwan Parent Portal - Premium ERP Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.4.0

  # Local Storage
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # UI & Design
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Charts
  fl_chart: ^0.68.0

  # Utils
  intl: ^0.20.2
  timeago: ^3.6.1

  # File & PDF
  path_provider: ^2.1.3
  open_filex: ^4.3.4
  url_launcher: ^6.2.6
  file_picker: ^8.0.3
  image_picker: ^1.1.2

  # Socket.IO real-time
  socket_io_client: ^2.0.3+1

  # Push Notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.0.0

  # Forms
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.1.2

  # Localization
  easy_localization: ^3.0.7

  # Misc
  flutter_staggered_animations: ^1.1.1
  liquid_progress_indicator_v2: ^0.5.0

  # Biometric authentication
  local_auth: ^2.3.0

  # Connectivity check (offline detection)
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter_native_splash:
  color: "#0C3B8A"
  image: assets/images/splash_logo.png
  color_dark: "#0C3B8A"
  image_dark: assets/images/splash_logo.png
  android_12:
    color: "#0C3B8A"
    image: assets/images/splash_logo.png

flutter:
  uses-material-design: true
