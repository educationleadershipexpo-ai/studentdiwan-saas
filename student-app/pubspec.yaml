  timeago: ^3.6.1
  path_provider: ^2.1.3
  open_filex: ^4.3.4
  url_launcher: ^6.2.6
  file_picker: ^8.0.3
  image_picker: ^1.1.2
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.1.2

dev_dependencies:
